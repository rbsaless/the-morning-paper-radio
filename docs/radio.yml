name: Gerar programa de rádio

on:
  workflow_dispatch:   # botão "Run workflow"; sem cron

permissions:
  contents: write

concurrency: radio

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install edge-tts
          ffmpeg -version | head -n 1
      - name: Gerar programa
        run: python radio.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Publicar
        run: |
          git config user.name "radio-bot"
          git config user.email "radio-bot@users.noreply.github.com"
          git add -A docs estado.json
          git commit -m "Programa de $(TZ=America/Sao_Paulo date '+%F %H:%M')" || exit 0
          git push
